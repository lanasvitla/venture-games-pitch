    catch (e) { if (!quiet) document.getElementById("e").textContent = "Неверный пароль"; return false; }
  }
  (async function () {
    var pw = null, m = location.hash.match(/k=([^&]+)/);
    if (m) { pw = decodeURIComponent(m[1]); history.replaceState(null, "", location.pathname + location.search); }
    else { try { pw = sessionStorage.getItem("vgk") || localStorage.getItem("vgk"); } catch (e) {} }
    if (pw && await attempt(pw, true)) return;
    document.getElementById("f").addEventListener("submit", async function (ev) { ev.preventDefault(); await attempt(document.getElementById("p").value, false); });
  })();
})();
</script>
